name: Docker images

# Builds and publishes the backend and frontend images to ghcr.io. Only when started by hand (Actions > Docker
# images > Run workflow) by someone with write access: it never runs on pushes, pull requests or tags, so it can't
# use up the Actions budget on its own. Forks can't run it either (see `if:` below).
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version tag to publish, e.g. 1.2.0 (empty publishes only the commit's sha tag)
        type: string
        required: false
        default: ""
      latest:
        description: Also tag this build as `latest`
        type: boolean
        default: false
      platforms:
        description: Platforms to build
        type: choice
        default: linux/amd64,linux/arm64
        options:
          - linux/amd64,linux/arm64
          - linux/amd64

concurrency:
  group: docker-images
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Each architecture builds on its own native runner (no QEMU emulation), then `merge` joins the two into one
  # multi-arch tag. This job turns the `platforms` input into the build matrix.
  plan:
    if: github.repository == 'shaongitbd/doory'
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          jq -cn --arg platforms "$PLATFORMS" '
            [{platform: "linux/amd64", runner: "ubuntu-24.04"},
             {platform: "linux/arm64", runner: "ubuntu-24.04-arm"}]
            | map(select(.platform as $p | $platforms | split(",") | index($p)))
            as $archs
            | [{name: "backend", "build-args": "INSTALL_CHROMIUM=true"},
               {name: "frontend", "build-args": ""}]
            | {include: [.[] as $image | $archs[] | $image + .]}
          ' | sed 's/^/matrix=/' >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # Inputs reach shell commands only through env vars, never pasted into the script.
      - name: Check the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION" ] && ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "The version must look like 1.2.0." >&2
            exit 1
          fi

      # Third-party actions are pinned to full commit SHAs (the release is in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/shaongitbd/doory-${{ matrix.name }}
          labels: |
            org.opencontainers.image.title=Doory ${{ matrix.name }}
            org.opencontainers.image.licenses=AAL

      # Pushed by digest only, without a tag: `merge` tags it once every architecture is in.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.name }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ matrix.build-args }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=ghcr.io/shaongitbd/doory-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.name }}-${{ matrix.platform }}
          cache-to: type=gha,scope=${{ matrix.name }}-${{ matrix.platform }},mode=max

      - name: Save the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
          echo "ARCH=${PLATFORM#linux/}" >> "$GITHUB_ENV"
        working-directory: ${{ runner.temp }}

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.name }}-${{ env.ARCH }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        name: [backend, frontend]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.name }}-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/shaongitbd/doory-${{ matrix.name }}
          tags: |
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ inputs.latest }}
            type=sha,format=long

      - name: Tag the multi-arch image
        env:
          IMAGE: ghcr.io/shaongitbd/doory-${{ matrix.name }}
          VERSION: ${{ steps.meta.outputs.version }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:$VERSION"
